name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyBv_kiGxaszA67RmDmSgYwo9cbTQd0yM1Q"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "coreaura-licencias.firebaseapp.com"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "coreaura-licencias"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "coreaura-licencias.firebasestorage.app"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1026152968750"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:1026152968750:web:eebfbaf8a8d6edc97325bf"
        NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
        NEXT_PUBLIC_API_URL: "http://localhost:3000"
        NEXTAUTH_URL: "http://localhost:3000"
        NEXTAUTH_SECRET: "placeholder"
        AUTH_SECRET: "placeholder"
        RESEND_API_KEY: "placeholder"
        MERCADOPAGO_ACCESS_TOKEN: "placeholder"
        FIREBASE_ADMIN_PROJECT_ID: "placeholder"
        FIREBASE_ADMIN_CLIENT_EMAIL: "placeholder"
        FIREBASE_ADMIN_PRIVATE_KEY: "placeholder"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Deploy to admin server
      uses: appleboy/ssh-action@v1
      with:
        host: 163.192.137.253
        username: ubuntu
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: 22
        script: |
          cd ~/coreaura-sistema-licencias
          nohup ./scripts/deploy.sh > deploy.log 2>&1 &
          echo "Despliegue de licencias iniciado"
